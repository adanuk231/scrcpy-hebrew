[package]
name = "scrcpy-board"
version = "0.1.0"
edition = "2021"
description = "A pedalboard for Android phones, built on scrcpy"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
